<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Personal History of Deep Learning</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme">

  <style>
    /* Headings */
    .reveal h1, .reveal h2, .reveal h3, .reveal h4 { text-transform: none; }
    .reveal h1 { font-size: 1.9em; }
    .reveal h2 { font-size: 1.5em; }
    .reveal h3 { font-size: 1.15em; color: #2563eb; }
    .reveal h4 { font-size: 1em; color: #555; }
    .reveal p, .reveal li { font-size: 0.72em; line-height: 1.45; }
    .reveal a { color: #2563eb; }
    .reveal .slide-number { font-size: 14px; }
    .reveal .slides section { text-align: left; }

    /* Image sizing — sized in PIXELS relative to the slide's coordinate
       space (1200×760, see Reveal.initialize), which Reveal scales as a
       single unit to fit the viewport. Avoid `vh` here because that's
       relative to the BROWSER viewport, not the scaled slide.
       The `data-image-count` attribute is set by the JS at the bottom of
       the page (capped at 7 — slides with more images stack at the
       smallest size and may overflow). */
    .reveal .slides section img {
      max-width: 95%;
      max-height: 580px;      /* fallback if data-image-count unset */
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 2px 14px rgba(0,0,0,0.12);
      border-radius: 4px;
      margin: 4px auto;
      display: block;
    }
    .reveal section[data-image-count="1"] img { max-height: 580px; }
    .reveal section[data-image-count="2"] img { max-height: 480px; }
    .reveal section[data-image-count="3"] img { max-height: 380px; }
    .reveal section[data-image-count="4"] img { max-height: 280px; }
    .reveal section[data-image-count="5"] img { max-height: 200px; }
    .reveal section[data-image-count="6"] img { max-height: 160px; }
    .reveal section[data-image-count="7"] img { max-height: 130px; }

    /* When there are 2 or 3 images on a slide, lay them side-by-side so
       neither has to shrink as much vertically. (Markdown wraps each image
       in its own <p>; we flex those wrappers.) */
    .reveal section[data-image-count="2"] p:has(> img),
    .reveal section[data-image-count="3"] p:has(> img) {
      display: inline-block;
      vertical-align: top;
      margin: 4px 0.5%;
    }
    .reveal section[data-image-count="2"] p:has(> img) { width: 48%; }
    .reveal section[data-image-count="3"] p:has(> img) { width: 31%; }
    .reveal section[data-image-count="2"] p:has(> img) img,
    .reveal section[data-image-count="3"] p:has(> img) img {
      max-width: 100%;
    }

    /* Multi-image slides: tighter paragraph spacing so things pack. */
    .reveal section[data-image-count]:not([data-image-count="1"]) p {
      margin: 0.2em 0;
    }
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md" data-charset="utf-8"></section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      controls: true,
      progress: true,
      center: false,
      transition: 'slide',
      width: 1200,
      height: 760,
      margin: 0.05,
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });

    // After the markdown plugin has built all <section> elements, count the
    // images on each and write data-image-count so CSS can pick the right
    // max-height cap. Runs after every slide change so dynamically loaded
    // slides also get tagged.
    function tagImageCounts() {
      document.querySelectorAll('.reveal .slides section').forEach(s => {
        const n = s.querySelectorAll('img').length;
        if (n > 0) s.setAttribute('data-image-count', String(Math.min(n, 7)));
      });
    }
    Reveal.on('ready', tagImageCounts);
    Reveal.on('slidetransitionend', tagImageCounts);
  </script>
</body>
</html>
