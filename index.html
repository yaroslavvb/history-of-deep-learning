<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Personal History of Deep Learning</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme">

  <style>
    /* keep huge inline images from blowing past slide bounds */
    .reveal .slides section img {
      max-height: 65vh;
      width: auto;
      box-shadow: 0 2px 14px rgba(0,0,0,0.12);
      border-radius: 4px;
    }
    .reveal h1, .reveal h2, .reveal h3, .reveal h4 { text-transform: none; }
    .reveal h1 { font-size: 1.9em; }
    .reveal h2 { font-size: 1.5em; }
    .reveal h3 { font-size: 1.15em; color: #2563eb; }
    .reveal h4 { font-size: 1em; color: #555; }
    .reveal p, .reveal li { font-size: 0.72em; line-height: 1.45; }
    .reveal pre code { font-size: 0.8em; }
    .reveal a { color: #2563eb; }
    .reveal .slide-number { font-size: 14px; }

    /* fit-text on slides with lots of content */
    .reveal .slides section { text-align: left; }
    .reveal .slides section.center { text-align: center; }

    /* dim the print-only PDF placeholder */
    .print-pdf .reveal .slides { transform: none !important; }
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <!-- Loaded from slides.md so the markdown lives separately. The plugin
           uses Reveal's default separator (lines containing `---`) to break
           into slides; we preprocess the README to insert those breaks. -->
      <section data-markdown="slides.md" data-charset="utf-8"></section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

  <script>
    Reveal.initialize({
      hash: true,                  // each slide gets its own URL fragment
      slideNumber: 'c/t',          // current / total in bottom-right
      controls: true,
      progress: true,
      center: false,               // align content to top of slide
      transition: 'slide',
      width: 1200,
      height: 760,
      margin: 0.05,
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });
  </script>
</body>
</html>
